<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>集成战略：燃梦行动</title>
    <style>
        .selectiontable {
            width: 99%;
            overflow-x: auto;
            position: relative;
            padding: 20px;
            margin-top: 30px;
        }

        #selection-table {
            width: 2500px;
            border-collapse: collapse;
            margin-bottom: 10px;
        }

        #selection-table th,
        #selection-table td {
            border: 1px solid #000;
            padding: 5px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        #selection-table tbody td {
            white-space: nowrap;
        }

        .selectable {
            cursor: pointer;
        }

        .selected {
            background-color: #076f92;
            color: #fff;
        }

        #selected-description {
            margin: 10px 0;
            padding: 5px;
            border: 1px solid #000;
            min-height: 300px;
            background-color: rgba(255, 198, 198, 0.25);
        }

        .disabled {
            background-color: #ccc;
            text-decoration: line-through;
            color: #000;
        }

        /* 表格头部的样式 */
        #selection-table th {
            background-color: #ff0000;
            color: #fff;
            font-weight: bold;
        }

        ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: grey;
            position: fixed;
            top: 0;
            width: 100%;
        }

        li {
            float: left;
        }

        li a {
            display: block;
            color: white;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }

        li a:hover:not(.active) {
            background-color: #111;
        }

        .active {
            background-color: blueviolet;
        }

        .bottom-image {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            opacity: 0.3;
            z-index: -1;
        }
    </style>
</head>

<body>
    <ul>
        <li><a href="https://longxuanyue.github.io/CJB/CJB-4/第四届重交杯">当期赛事主页</a></li>
        <li><a class="active" href="https://longxuanyue.github.io/CJB/CJB-4/赛事规则">赛事规则</a></li>
        <li style="float:right"><a href="https://longxuanyue.github.io/CJB/">返回</a></li>
    </ul>
</body>

</html>
